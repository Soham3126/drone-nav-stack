# Nav2 planner server + global cost map (guidebook 2.6), adapted for ROS 2 Humble (Nav2 1.1.x):
#  - plugin names use the Humble "package/Class" form for the planner.
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 5.0         # C4: 2.0 (book) let paths hug inside corners; with the carrot cutting corners the stub drone touched walls
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0               # C4: 1.0 left the cost map up to 2 s behind the map in flight (planner refused fresh frontiers)
      publish_frequency: 1.0
      resolution: 0.05
      robot_radius: 0.27
      track_unknown_space: true
      trinary_costmap: true
      lethal_cost_threshold: 65
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 5.0
